[package]
name = "wgpu_image_tools"
version = "0.1.0"
authors = ["Solace <solace.lee.lzm@gmail.com>"]
edition = "2024"
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cfg-if = "1"
winit = { version = "0.29", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "25.0"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "25.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}

[[bin]]
name = "start"
path = "src/main.rs"

[[bin]]
name = "challenge"
path = "src/challenge.rs"
